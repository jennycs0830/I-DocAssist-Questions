<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Policy QA Explorer</title>
<style>
  /* layout: left = source document reader with highlighted evidence span, right = filterable question ledger */
  :root {
    --bg: #f2efe7;
    --surface: #ffffff;
    --ink: #1c2430;
    --muted: #667085;
    --accent: #2f6f62;
    --accent-soft: #e3ede9;
    --accent-2: #a8631f;
    --accent-2-soft: #f3e6d6;
    --border: #dcd6c8;
    --chip-bg: #ece8dc;
    --mark-bg: #f6d978;
    --mark-fg: #1c2430;
    --danger: #a13d3d;
    --font-display: 'IBM Plex Sans', -apple-system, sans-serif;
    --font-body: 'IBM Plex Sans', -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181f; --surface: #1c222c; --ink: #e9ecf1; --muted: #93a0b4;
      --accent: #6fbfab; --accent-soft: #1f2e2a; --accent-2: #d99a56; --accent-2-soft: #2e2419;
      --border: #333c4a; --chip-bg: #262e3a; --mark-bg: #a67c1e; --mark-fg: #14181f; --danger: #d97a7a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14181f; --surface: #1c222c; --ink: #e9ecf1; --muted: #93a0b4;
    --accent: #6fbfab; --accent-soft: #1f2e2a; --accent-2: #d99a56; --accent-2-soft: #2e2419;
    --border: #333c4a; --chip-bg: #262e3a; --mark-bg: #a67c1e; --mark-fg: #14181f; --danger: #d97a7a;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font-body);
    margin: 0; padding-inline: 16px; padding-block: 12px; display: flex; flex-direction: column;
  }
  h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
  .app { max-width: 1440px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; }

  header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
  header.top h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; }
  header.top .subtitle { color: var(--muted); font-size: 0.8rem; }
  .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .export-btn {
    font-family: var(--font-body); font-size: 0.78rem; padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink); cursor: pointer;
  }
  .export-btn:hover { border-color: var(--accent); color: var(--accent); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; min-width: 0; }
  .stat .n { font-family: var(--font-mono); font-size: 1.2rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }

  .split { display: flex; gap: 12px; flex: 1; min-height: 480px; }
  @media (max-width: 900px) { .split { flex-direction: column; min-height: 0; } }

  .doc-panel {
    flex: 1 1 46%; min-width: 0; display: flex; flex-direction: column; gap: 8px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px;
    min-height: 320px;
  }
  .doc-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .doc-head select { font-family: var(--font-body); font-size: 0.82rem; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--ink); max-width: 100%; }
  .doc-hint { font-size: 0.72rem; color: var(--muted); }
  .doc-body {
    flex: 1; overflow-y: auto; min-height: 0; overflow-x: auto;
    font-family: var(--font-body); font-size: 0.86rem; line-height: 1.6; word-break: break-word;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px;
  }
  .doc-body h1, .doc-body h2, .doc-body h3, .doc-body h4 { font-family: var(--font-display); line-height: 1.3; margin: 0.9em 0 0.35em; }
  .doc-body h1 { font-size: 1.25rem; } .doc-body h2 { font-size: 1.1rem; } .doc-body h3 { font-size: 1rem; } .doc-body h4 { font-size: 0.92rem; }
  .doc-body p { margin: 0.5em 0; }
  .doc-body ul, .doc-body ol { margin: 0.4em 0; padding-left: 1.3em; }
  .doc-body li { margin: 0.15em 0; }
  .doc-body strong { font-weight: 600; }
  .doc-body code { font-family: var(--font-mono); font-size: 0.85em; background: var(--chip-bg); padding: 1px 4px; border-radius: 4px; }
  .doc-body hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }
  .doc-body table { border-collapse: collapse; margin: 0.6em 0; font-size: 0.82rem; display: block; overflow-x: auto; }
  .doc-body th, .doc-body td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
  .doc-body th { background: var(--chip-bg); font-family: var(--font-display); font-weight: 600; }
  .doc-body mark {
    background: var(--mark-bg); color: var(--mark-fg); border-radius: 3px; padding: 0 2px; scroll-margin: 40px;
  }
  .doc-body mark.hop-2, .doc-body mark.hop-3, .doc-body mark.hop-4, .doc-body mark.hop-5 { outline: 2px solid var(--accent-2); outline-offset: 1px; }

  .right-panel { flex: 1 1 54%; min-width: 0; display: flex; gap: 12px; }
  @media (max-width: 900px) { .right-panel { flex-direction: column; } }

  .filters {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px;
    display: flex; flex-direction: column; gap: 12px; width: 230px; flex-shrink: 0;
    max-height: 100%; overflow-y: auto;
  }
  @media (max-width: 900px) { .filters { width: 100%; max-height: none; flex-direction: row; flex-wrap: wrap; } }
  @media (max-width: 900px) { .filters .filter-group { min-width: 160px; flex: 1; } }
  .filter-group { display: flex; flex-direction: column; gap: 5px; }
  .filter-group .fl { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
  .seg { display: flex; flex-wrap: wrap; gap: 5px; }
  .seg button {
    font-family: var(--font-body); font-size: 0.75rem; border: 1px solid var(--border); background: var(--bg);
    color: var(--ink); border-radius: 999px; padding: 4px 9px; cursor: pointer;
  }
  .seg button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  select, input[type="search"] {
    font-family: var(--font-body); font-size: 0.82rem; padding: 6px 8px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--ink); width: 100%;
  }
  select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .req-list { display: flex; flex-direction: column; gap: 3px; max-height: 180px; overflow-y: auto; }
  .req-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 0.76rem; cursor: pointer; padding: 3px 4px; border-radius: 6px; }
  .req-row:hover { background: var(--chip-bg); }
  .req-row input { accent-color: var(--accent); }
  .req-row .cnt { font-family: var(--font-mono); color: var(--muted); font-size: 0.68rem; }
  .reset-btn { font-family: var(--font-body); font-size: 0.75rem; color: var(--accent); background: none; border: none; cursor: pointer; text-align: left; padding: 0; text-decoration: underline; }

  .results { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .results-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .results-head .count { font-size: 0.8rem; color: var(--muted); }
  .cards-scroll { flex: 1; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding-right: 2px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px;
    display: flex; flex-direction: column; gap: 6px; cursor: pointer;
  }
  .card:hover { border-color: var(--accent); }
  .card.selected { border-color: var(--accent); background: var(--accent-soft); }
  .badges { display: flex; flex-wrap: wrap; gap: 5px; }
  .badge { font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.02em; padding: 2px 6px; border-radius: 5px; background: var(--chip-bg); color: var(--muted); white-space: nowrap; }
  .badge.corpus-chibench { background: var(--accent-soft); color: var(--accent); }
  .badge.corpus-ours { background: var(--accent-2-soft); color: var(--accent-2); }
  .badge.hop-multi { border: 1px solid var(--accent-2); color: var(--accent-2); background: transparent; }
  .badge.code { background: var(--ink); color: var(--bg); }

  .q { font-size: 0.92rem; line-height: 1.4; }
  .a-row { display: flex; gap: 8px; align-items: baseline; }
  .a-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); flex-shrink: 0; }
  .a { font-family: var(--font-mono); font-size: 0.84rem; background: var(--accent-soft); color: var(--ink); padding: 3px 7px; border-radius: 6px; }
  .meta-row { display: flex; justify-content: space-between; gap: 8px; font-size: 0.7rem; color: var(--muted); flex-wrap: wrap; }

  .badge.diff-easy { color: var(--accent); }
  .badge.diff-medium { color: var(--accent-2); }
  .badge.diff-hard { background: var(--ink); color: var(--bg); }

  .review-row { display: flex; align-items: center; gap: 6px; padding-top: 4px; border-top: 1px dashed var(--border); margin-top: 2px; }
  .verdict-btn {
    font-family: var(--font-body); font-size: 0.76rem; padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--bg); color: var(--muted); cursor: pointer;
  }
  .verdict-btn.good.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .verdict-btn.bad.active { background: var(--danger); border-color: var(--danger); color: #fff; }
  .note-toggle {
    font-family: var(--font-body); font-size: 0.74rem; color: var(--muted); background: none; border: none;
    cursor: pointer; text-decoration: underline; margin-left: auto;
  }
  .note-toggle.has-note { color: var(--accent-2); font-weight: 600; }
  .review-note {
    width: 100%; font-family: var(--font-body); font-size: 0.8rem; border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 8px; background: var(--bg); color: var(--ink); resize: vertical;
    min-height: 44px; margin-top: 4px;
  }
  .card.has-review { border-left: 3px solid var(--accent); }
  .card.has-review.marked-bad { border-left-color: var(--danger); }

  .empty { text-align: center; color: var(--muted); padding: 30px 15px; font-size: 0.85rem; }
  .load-more { display: flex; justify-content: center; padding: 4px 0; }
  .load-more button { font-family: var(--font-body); font-size: 0.82rem; padding: 7px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); cursor: pointer; }
  .load-more button:hover { border-color: var(--accent); color: var(--accent); }

  [hidden] { display: none !important; }
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body>

<div class="app">
  <header class="top">
    <div>
      <h1>Policy QA Explorer</h1>
      <div class="subtitle">Click any question to see its exact source passage highlighted on the left</div>
    </div>
    <div class="header-actions">
      <div class="seg" id="f-scope"></div>
      <button class="export-btn" id="export-reviews">Export my reviews</button>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="split">
    <div class="doc-panel">
      <div class="doc-head">
        <select id="doc-select"></select>
        <span class="doc-hint" id="doc-hint">Select a question to highlight its source</span>
      </div>
      <div class="doc-body" id="doc-body"></div>
    </div>

    <div class="right-panel">
      <aside class="filters">
        <div class="filter-group">
          <div class="fl">Corpus</div>
          <div class="seg" id="f-corpus"></div>
        </div>
        <div class="filter-group">
          <div class="fl">Hop type</div>
          <div class="seg" id="f-hop"></div>
        </div>
        <div class="filter-group">
          <div class="fl">Direction</div>
          <select id="f-direction"></select>
        </div>
        <div class="filter-group">
          <div class="fl">Difficulty</div>
          <div class="seg" id="f-difficulty"></div>
        </div>
        <div class="filter-group">
          <div class="fl">Requirement type</div>
          <div class="req-list" id="f-requirement"></div>
        </div>
        <div class="filter-group">
          <div class="fl">Your review</div>
          <div class="seg" id="f-reviewed"></div>
        </div>
        <div class="filter-group">
          <div class="fl">Search</div>
          <input type="search" id="f-search" placeholder="e.g. 28289, HSAT…">
        </div>
        <button class="reset-btn" id="reset">Reset all filters</button>
      </aside>

      <section class="results">
        <div class="results-head">
          <div class="count" id="result-count"></div>
        </div>
        <div class="cards-scroll" id="cards-scroll">
          <div id="cards"></div>
          <div class="load-more" id="load-more-wrap" hidden>
            <button id="load-more">Show 50 more</button>
          </div>
          <div class="empty" id="empty-state" hidden>No questions match these filters.</div>
        </div>
      </section>
    </div>
  </div>
</div>

<script>
(function () {
  var state = {
    scope: 'round1', corpus: 'all', hop: 'all', direction: 'all', difficulty: 'all', reviewed: 'all',
    requirementTypes: new Set(), search: '', shown: 50,
    selectedQuestionId: null, selectedDocId: null,
  };

  var QUESTIONS = [];
  var DOCUMENTS = {};
  var reqCounts = {};
  var REVIEWS = {}; // questionId (string) -> { verdict: 'good'|'bad'|null, comment: string }

  function loadReviews() {
    try {
      REVIEWS = JSON.parse(localStorage.getItem('pa-qa-explorer-reviews') || '{}');
    } catch (e) { REVIEWS = {}; }
  }
  function saveReviews() {
    try { localStorage.setItem('pa-qa-explorer-reviews', JSON.stringify(REVIEWS)); } catch (e) {}
  }
  function getReview(id) { return REVIEWS[id] || { verdict: null, comment: '' }; }
  function setReview(id, patch) {
    var cur = getReview(id);
    var next = { verdict: cur.verdict, comment: cur.comment };
    if ('verdict' in patch) next.verdict = patch.verdict;
    if ('comment' in patch) next.comment = patch.comment;
    if (!next.verdict && !next.comment) { delete REVIEWS[id]; } else { REVIEWS[id] = next; }
    saveReviews();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function corpusLabel(c) { return c === 'chibench' ? 'Chi-Bench' : 'Our corpus'; }

  function loadState() {
    try {
      var saved = JSON.parse(localStorage.getItem('pa-qa-explorer-filters') || '{}');
      if (saved.scope) state.scope = saved.scope;
      if (saved.corpus) state.corpus = saved.corpus;
      if (saved.hop) state.hop = saved.hop;
      if (saved.direction) state.direction = saved.direction;
      if (saved.difficulty) state.difficulty = saved.difficulty;
      if (saved.reviewed) state.reviewed = saved.reviewed;
      if (Array.isArray(saved.requirementTypes)) state.requirementTypes = new Set(saved.requirementTypes);
    } catch (e) {}
  }
  function saveState() {
    try {
      localStorage.setItem('pa-qa-explorer-filters', JSON.stringify({
        scope: state.scope, corpus: state.corpus, hop: state.hop, direction: state.direction,
        difficulty: state.difficulty, reviewed: state.reviewed,
        requirementTypes: Array.from(state.requirementTypes),
      }));
    } catch (e) {}
  }

  function buildStats() {
    var pool = state.scope === 'round1' ? QUESTIONS.filter(function (d) { return d.round1; }) : QUESTIONS;
    var total = pool.length;
    var chibench = pool.filter(function (d) { return d.corpus === 'chibench'; }).length;
    var ours = pool.filter(function (d) { return d.corpus === 'ours'; }).length;
    var single = pool.filter(function (d) { return d.hop === 'single'; }).length;
    var multi = pool.filter(function (d) { return d.hop === 'multi'; }).length;
    var reviewedCount = pool.filter(function (d) { return getReview(d.id).verdict; }).length;
    var stats = [[total, 'Shown scope'], [chibench, 'Chi-Bench'], [ours, 'Our corpus'], [single, 'Single-hop'], [multi, 'Multi-hop'], [reviewedCount, 'Reviewed']];
    document.getElementById('stats').innerHTML = stats.map(function (s) {
      return '<div class="stat"><div class="n">' + s[0] + '</div><div class="l">' + s[1] + '</div></div>';
    }).join('');
  }

  function buildScopeFilter() {
    var opts = [['round1', 'Round 1 review set (' + QUESTIONS.filter(function (d) { return d.round1; }).length + ')'], ['all', 'All questions (' + QUESTIONS.length + ')']];
    var el = document.getElementById('f-scope');
    el.innerHTML = opts.map(function (o) { return '<button data-v="' + o[0] + '" class="' + (state.scope === o[0] ? 'active' : '') + '">' + o[1] + '</button>'; }).join('');
    el.querySelectorAll('button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.scope = btn.getAttribute('data-v'); state.shown = 50; saveState();
        el.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === btn); });
        buildStats();
        buildRequirementFilter();
        render();
      });
    });
  }

  function buildDifficultyFilter() {
    var opts = [['all', 'All'], ['easy', 'Easy'], ['medium', 'Medium'], ['hard', 'Hard']];
    var el = document.getElementById('f-difficulty');
    el.innerHTML = opts.map(function (o) { return '<button data-v="' + o[0] + '" class="' + (state.difficulty === o[0] ? 'active' : '') + '">' + o[1] + '</button>'; }).join('');
    el.querySelectorAll('button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.difficulty = btn.getAttribute('data-v'); state.shown = 50; saveState();
        el.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === btn); });
        render();
      });
    });
  }

  function buildReviewedFilter() {
    var opts = [['all', 'All'], ['unreviewed', 'Not yet'], ['good', 'Good'], ['bad', 'Bad']];
    var el = document.getElementById('f-reviewed');
    el.innerHTML = opts.map(function (o) { return '<button data-v="' + o[0] + '" class="' + (state.reviewed === o[0] ? 'active' : '') + '">' + o[1] + '</button>'; }).join('');
    el.querySelectorAll('button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.reviewed = btn.getAttribute('data-v'); state.shown = 50; saveState();
        el.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === btn); });
        render();
      });
    });
  }

  function buildDocSelect() {
    var el = document.getElementById('doc-select');
    var ids = Object.keys(DOCUMENTS);
    el.innerHTML = ids.map(function (id) {
      var d = DOCUMENTS[id];
      return '<option value="' + id + '">' + escapeHtml(d.filename) + ' (' + corpusLabel(d.corpus) + ')</option>';
    }).join('');
    if (!state.selectedDocId) state.selectedDocId = ids[0];
    el.value = state.selectedDocId;
    el.addEventListener('change', function () {
      state.selectedDocId = el.value;
      state.selectedQuestionId = null;
      renderDoc([]);
    });
  }

  function renderDoc(highlightRanges) {
    var doc = DOCUMENTS[state.selectedDocId];
    var body = document.getElementById('doc-body');
    if (!doc) { body.innerHTML = ''; return; }
    var text = doc.text;
    var ranges = (highlightRanges || []).filter(function (r) { return r.start != null && r.end != null; })
      .sort(function (a, b) { return a.start - b.start; });
    // Splice raw <mark> tags directly into the markdown source (not escaped text),
    // then let marked.js render the whole thing -- this renders real formatting
    // (headings, bold, tables) instead of showing raw markdown syntax.
    var spliced = '';
    var cursor = 0;
    ranges.forEach(function (r, i) {
      if (r.start < cursor) return;
      spliced += text.slice(cursor, r.start);
      var cls = ranges.length > 1 ? ' class="hop-' + (i + 1) + '"' : '';
      spliced += '<mark id="hl-' + i + '"' + cls + '>' + text.slice(r.start, r.end) + '</mark>';
      cursor = r.end;
    });
    spliced += text.slice(cursor);
    try {
      body.innerHTML = marked.parse(spliced);
    } catch (e) {
      body.textContent = text;
    }
    if (ranges.length) {
      var first = document.getElementById('hl-0');
      if (first && typeof first.scrollIntoView === 'function') first.scrollIntoView({ block: 'center' });
      document.getElementById('doc-hint').textContent = ranges.length > 1
        ? ranges.length + ' source passages for this question, in reading order'
        : 'Source passage for the selected question';
    } else {
      document.getElementById('doc-hint').textContent = 'Select a question to highlight its source';
      body.scrollTop = 0;
    }
  }

  function highlightForQuestion(q) {
    var doc = DOCUMENTS[q.document_id];
    if (!doc) return [];
    return (q.chunk_ids || []).map(function (cid) {
      var c = doc.chunks.find(function (ch) { return ch.chunk_id === cid; });
      return c ? { start: c.start, end: c.end } : null;
    }).filter(Boolean);
  }

  // Keep the left panel in sync whenever the filtered question set changes:
  // if the current selection drops out of view, jump to the first visible
  // result instead of leaving a stale highlight on screen.
  function syncDocPanelToResults(results) {
    var stillVisible = results.some(function (r) { return r.id === state.selectedQuestionId; });
    if (stillVisible) return;
    if (results.length === 0) {
      state.selectedQuestionId = null;
      renderDoc([]);
      return;
    }
    var q = results[0];
    state.selectedQuestionId = q.id;
    if (q.document_id && q.document_id !== state.selectedDocId) {
      state.selectedDocId = q.document_id;
      document.getElementById('doc-select').value = q.document_id;
    }
    renderDoc(highlightForQuestion(q));
  }

  function selectQuestion(q) {
    state.selectedQuestionId = q.id;
    if (q.document_id && q.document_id !== state.selectedDocId) {
      state.selectedDocId = q.document_id;
      document.getElementById('doc-select').value = q.document_id;
    }
    renderDoc(highlightForQuestion(q));
    render();
  }

  function buildCorpusFilter() {
    var opts = [['all', 'All'], ['chibench', 'Chi-Bench'], ['ours', 'Our corpus']];
    var el = document.getElementById('f-corpus');
    el.innerHTML = opts.map(function (o) { return '<button data-v="' + o[0] + '" class="' + (state.corpus === o[0] ? 'active' : '') + '">' + o[1] + '</button>'; }).join('');
    el.querySelectorAll('button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.corpus = btn.getAttribute('data-v'); state.shown = 50; saveState();
        el.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === btn); });
        render();
      });
    });
  }
  function buildHopFilter() {
    var opts = [['all', 'All'], ['single', 'Single-hop'], ['multi', 'Multi-hop']];
    var el = document.getElementById('f-hop');
    el.innerHTML = opts.map(function (o) { return '<button data-v="' + o[0] + '" class="' + (state.hop === o[0] ? 'active' : '') + '">' + o[1] + '</button>'; }).join('');
    el.querySelectorAll('button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.hop = btn.getAttribute('data-v'); state.shown = 50; saveState();
        el.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === btn); });
        render();
      });
    });
  }
  function buildDirectionFilter() {
    var dirs = Array.from(new Set(QUESTIONS.map(function (d) { return d.direction || 'other'; }))).sort();
    var el = document.getElementById('f-direction');
    el.innerHTML = ['<option value="all">All directions</option>'].concat(
      dirs.map(function (d) { return '<option value="' + d + '">' + d.replace(/_/g, ' ') + '</option>'; })
    ).join('');
    el.value = state.direction;
    el.addEventListener('change', function () { state.direction = el.value; state.shown = 50; saveState(); render(); });
  }
  function buildRequirementFilter() {
    reqCounts = {};
    var pool = state.scope === 'round1' ? QUESTIONS.filter(function (d) { return d.round1; }) : QUESTIONS;
    pool.forEach(function (d) { var k = d.requirement_type || 'other'; reqCounts[k] = (reqCounts[k] || 0) + 1; });
    var keys = Object.keys(reqCounts).sort(function (a, b) { return reqCounts[b] - reqCounts[a]; });
    var el = document.getElementById('f-requirement');
    el.innerHTML = keys.map(function (k) {
      var id = 'req-' + k;
      var checked = state.requirementTypes.has(k) ? 'checked' : '';
      return '<label class="req-row" for="' + id + '"><span><input type="checkbox" id="' + id + '" data-v="' + k + '" ' + checked + '> ' + k.replace(/_/g, ' ') + '</span><span class="cnt">' + reqCounts[k] + '</span></label>';
    }).join('');
    el.querySelectorAll('input').forEach(function (cb) {
      cb.addEventListener('change', function () {
        var v = cb.getAttribute('data-v');
        if (cb.checked) state.requirementTypes.add(v); else state.requirementTypes.delete(v);
        state.shown = 50; saveState(); render();
      });
    });
  }

  function filtered() {
    var q = state.search.trim().toLowerCase();
    var pool = state.scope === 'round1' ? QUESTIONS.filter(function (d) { return d.round1; }) : QUESTIONS;
    return pool.filter(function (d) {
      if (state.corpus !== 'all' && d.corpus !== state.corpus) return false;
      if (state.hop !== 'all' && d.hop !== state.hop) return false;
      if (state.direction !== 'all' && (d.direction || 'other') !== state.direction) return false;
      if (state.difficulty !== 'all' && (d.difficulty || 'unknown') !== state.difficulty) return false;
      if (state.requirementTypes.size > 0 && !state.requirementTypes.has(d.requirement_type || 'other')) return false;
      if (state.reviewed !== 'all') {
        var v = getReview(d.id).verdict;
        if (state.reviewed === 'unreviewed' && v) return false;
        if ((state.reviewed === 'good' || state.reviewed === 'bad') && v !== state.reviewed) return false;
      }
      if (q) {
        var hay = (d.question + ' ' + d.answer + ' ' + (d.cpt_code || '')).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function cardHtml(d) {
    var doc = DOCUMENTS[d.document_id];
    var review = getReview(d.id);
    var badges = '<span class="badge corpus-' + d.corpus + '">' + corpusLabel(d.corpus) + '</span>';
    badges += '<span class="badge' + (d.hop === 'multi' ? ' hop-multi' : '') + '">' + d.hop + '-hop' + (d.hop === 'multi' ? ' (' + d.chunk_ids.length + ')' : '') + '</span>';
    if (d.difficulty) badges += '<span class="badge diff-' + d.difficulty + '">' + d.difficulty + '</span>';
    badges += '<span class="badge">' + (d.requirement_type || 'other').replace(/_/g, ' ') + '</span>';
    if (d.direction && d.direction !== 'other') badges += '<span class="badge">' + d.direction.replace(/_/g, ' ') + '</span>';
    if (d.cpt_code) badges += '<span class="badge code">' + escapeHtml(d.cpt_code) + '</span>';
    var sel = d.id === state.selectedQuestionId ? ' selected' : '';
    var reviewCls = review.verdict ? ' has-review' + (review.verdict === 'bad' ? ' marked-bad' : '') : '';
    var noteHidden = review.comment ? '' : ' hidden';
    return '<div class="card' + sel + reviewCls + '" data-id="' + d.id + '">' +
      '<div class="badges">' + badges + '</div>' +
      '<div class="q">' + escapeHtml(d.question) + '</div>' +
      '<div class="a-row"><span class="a-label">Answer</span><span class="a">' + escapeHtml(d.answer) + '</span></div>' +
      '<div class="meta-row"><span>' + escapeHtml(doc ? doc.filename : '') + '</span><span>#' + d.id + '</span></div>' +
      '<div class="review-row">' +
        '<button class="verdict-btn good' + (review.verdict === 'good' ? ' active' : '') + '" data-verdict="good">Good</button>' +
        '<button class="verdict-btn bad' + (review.verdict === 'bad' ? ' active' : '') + '" data-verdict="bad">Bad</button>' +
        '<button class="note-toggle' + (review.comment ? ' has-note' : '') + '" data-action="toggle-note">' + (review.comment ? 'Edit note' : '+ Leave a note') + '</button>' +
      '</div>' +
      '<textarea class="review-note" placeholder="Why is this good/bad? Optional note for the team…"' + noteHidden + '>' + escapeHtml(review.comment) + '</textarea>' +
      '</div>';
  }

  function render() {
    var results = filtered();
    try {
      syncDocPanelToResults(results);
    } catch (e) {
      console.error('Left panel (document/highlight) failed to update; right panel will still render.', e);
    }
    document.getElementById('result-count').textContent = results.length + ' question' + (results.length === 1 ? '' : 's');
    var toShow = results.slice(0, state.shown);
    var cardsEl = document.getElementById('cards');
    cardsEl.innerHTML = toShow.map(cardHtml).join('');
    cardsEl.querySelectorAll('.card').forEach(function (card) {
      var id = parseInt(card.getAttribute('data-id'), 10);
      card.addEventListener('click', function (e) {
        if (e.target.closest('.review-row') || e.target.closest('.review-note')) return;
        var q = QUESTIONS.find(function (x) { return x.id === id; });
        if (q) selectQuestion(q);
      });
      card.querySelectorAll('.verdict-btn').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          var v = btn.getAttribute('data-verdict');
          var cur = getReview(id);
          setReview(id, { verdict: cur.verdict === v ? null : v });
          buildStats();
          render();
        });
      });
      var noteToggle = card.querySelector('.note-toggle');
      var noteBox = card.querySelector('.review-note');
      if (noteToggle) {
        noteToggle.addEventListener('click', function (e) {
          e.stopPropagation();
          noteBox.hidden = !noteBox.hidden;
          if (!noteBox.hidden) noteBox.focus();
        });
      }
      if (noteBox) {
        noteBox.addEventListener('click', function (e) { e.stopPropagation(); });
        noteBox.addEventListener('input', function () {
          setReview(id, { comment: noteBox.value });
        });
        noteBox.addEventListener('blur', function () {
          buildStats();
          var toggle = card.querySelector('.note-toggle');
          if (toggle) toggle.textContent = noteBox.value ? 'Edit note' : '+ Leave a note';
          if (toggle) toggle.classList.toggle('has-note', !!noteBox.value);
        });
      }
    });
    document.getElementById('empty-state').hidden = results.length !== 0;
    document.getElementById('load-more-wrap').hidden = results.length <= state.shown;
  }

  function wireStatic() {
    document.getElementById('f-search').addEventListener('input', function (e) { state.search = e.target.value; state.shown = 50; render(); });
    document.getElementById('load-more').addEventListener('click', function () { state.shown += 50; render(); });
    document.getElementById('reset').addEventListener('click', function () {
      state.corpus = 'all'; state.hop = 'all'; state.direction = 'all'; state.difficulty = 'all'; state.reviewed = 'all';
      state.requirementTypes = new Set(); state.search = ''; state.shown = 50;
      document.getElementById('f-search').value = '';
      saveState();
      buildCorpusFilter(); buildHopFilter(); buildDirectionFilter(); buildDifficultyFilter(); buildReviewedFilter(); buildRequirementFilter();
      render();
    });
    document.getElementById('export-reviews').addEventListener('click', function () {
      var rows = QUESTIONS.filter(function (d) { return getReview(d.id).verdict || getReview(d.id).comment; })
        .map(function (d) {
          var r = getReview(d.id);
          return {
            id: d.id, corpus: d.corpus, hop: d.hop, requirement_type: d.requirement_type,
            difficulty: d.difficulty, question: d.question, answer: d.answer,
            verdict: r.verdict, comment: r.comment,
          };
        });
      if (rows.length === 0) { alert('No reviews recorded yet -- mark at least one question Good/Bad or leave a note first.'); return; }
      var blob = new Blob([JSON.stringify(rows, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'pa-qa-reviews-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  }

  Promise.all([
    fetch('qa_data.json').then(function (r) { return r.json(); }),
    fetch('documents.json').then(function (r) { return r.json(); }),
  ]).then(function (results) {
    QUESTIONS = results[0];
    DOCUMENTS = results[1];
    loadState();
    loadReviews();
    buildStats();
    buildDocSelect();
    renderDoc([]);
    buildScopeFilter();
    buildCorpusFilter();
    buildHopFilter();
    buildDirectionFilter();
    buildDifficultyFilter();
    buildReviewedFilter();
    buildRequirementFilter();
    wireStatic();
    render();
  }).catch(function (err) {
    document.getElementById('cards').innerHTML = '<div class="empty">Could not load question data.</div>';
    console.error(err);
  });
})();
</script>
</body>
</html>
